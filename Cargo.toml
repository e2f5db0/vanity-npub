[package]
name = "vanity-npub"
version = "0.1.0"
edition = "2021"
description = "Fast CPU vanity Nostr npub miner"
license = "MIT"

[dependencies]
bech32 = "0.9"
ctrlc = "3.4"
hex = "0.4"
num_cpus = "1.16"
rand = "0.8"
secp256k1 = { version = "0.29", features = ["rand", "global-context"] }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true
